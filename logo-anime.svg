<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 44.594552 41.358149" width="400" height="371">
  <style>
    .s { fill: none; stroke: #32404e; stroke-linecap: round; }
    .draw { stroke-dasharray: 1 2; animation: draw var(--d, .7s) cubic-bezier(.65,0,.35,1) var(--t, 0s) both; }
    .rev  { animation-name: drawRev; }
    @keyframes draw    { from { stroke-dashoffset: 1;  opacity: 0; } 4% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
    @keyframes drawRev { from { stroke-dashoffset: -1; opacity: 0; } 4% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }

    .fall { animation: fall .9s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes fall { from { transform: translateY(-8px); opacity: 0; } 30% { opacity: 1; } to { transform: none; } }

    .chip { transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.34,1.8,.64,1) .55s both; }
    @keyframes pop { from { transform: scale(0) rotate(-45deg); } to { transform: none; } }

    .water { animation: fill 1.1s ease-in-out .5s both, fade .6s ease 1.9s forwards; }
    @keyframes fill { from { transform: translateY(19px); } to { transform: translateY(0); } }
    @keyframes fade { to { opacity: 0; } }
    .sap { animation: fill 1s ease-in-out 1s both, fade .6s ease 2s forwards; }

    .logo { transform-box: fill-box; transform-origin: center; animation: pulse .6s ease-in-out 2.05s both; }
    @keyframes pulse { 50% { transform: scale(1.05); } }

    .ripple { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ripple 1s ease-out 2.05s forwards; }
    @keyframes ripple { from { transform: scale(.4); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 1ms !important; animation-delay: 0s !important; }
      .water, .sap, .ripple { display: none; }
    }
  </style>
